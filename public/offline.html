<!doctype html>
<html lang="sr-Latn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#C2410C" />
  <meta name="robots" content="noindex" />
  <title>Nema interneta · Kokobleja</title>
  <style>
    html, body { margin: 0; height: 100%; background: #FFF7ED; color: #2B1B12;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; padding: 24px; text-align: center; box-sizing: border-box; }
    h1 { margin: 0; font-size: 26px; font-weight: 800; }
    p { margin: 0; color: #6B4F3F; max-width: 320px; line-height: 1.45; }
    button { margin-top: 8px; min-height: 48px; padding: 0 22px; border: none; border-radius: 16px;
      background: #C2410C; color: #fff; font: inherit; font-weight: 800; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/koka.png" width="104" height="104" alt="" style="border-radius:50%" />
    <h1>Nema interneta</h1>
    <p>Kokobleja treba internet da bi prikazala evente. Proveri vezu, pa pokušaj ponovo.</p>
    <button type="button" onclick="location.reload()">Pokušaj ponovo</button>
  </main>
</body>
</html>
